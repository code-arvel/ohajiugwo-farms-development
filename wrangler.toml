# Pages configuration for the approved free development preview.
name = "ohajiugwo-farms-development"
compatibility_date = "2025-01-01"
pages_build_output_dir = "hosting-output"
# Credentials belong in Cloudflare secrets or ignored .dev.vars, never this file.

# The media processor is only bound to preview deployments. Production has no
# binding or runtime secrets until its separate public release is prepared.
[[env.preview.services]]
binding = "MEDIA_PROCESSOR"
service = "ohajiugwo-image-processor-development"

# Hosted 013/014 are owner-applied and SQL verified. Runtime variables must be
# declared here because this file is the Pages deployment source of truth.
# This enables private photo details/recoverable trash in Preview only.
[env.preview.vars]
ADMIN_ENABLE_MEDIA_METADATA = "confirmed-development-only"

# Owner approved one second-administrator invitation test on 26 November.
# Provider requests still require recent administrator confirmation and explicit action.
ADMIN_ENABLE_ACCOUNT_EMAIL_DELIVERY = "confirmed-development-only"
